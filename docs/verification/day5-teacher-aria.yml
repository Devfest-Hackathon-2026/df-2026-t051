- main:
  - text: グラフを、学びの架け橋に。
  - heading "画像の向こうにある、 データを届けよう。" [level=1]
  - paragraph: 教材のグラフを読み取り、誰もが探索できるデータへ。 まずは画像をアップロードして、読み取り結果を確認しましょう。
  - list "教材作成の流れ":
    - listitem: 01画像選択 完了
    - listitem: 02AI解析 完了
    - listitem: 03教員確認 完了
    - listitem: 04承認 完了
    - listitem: 05共有 現在
  - paragraph: 承認済み教材を表示しています。次に学生向け教材を開いて配布内容を確認してください。
  - paragraph: 非公開IAM検証環境です。認証付きのローカルプロキシから操作してください。実Gemini APIで画像を解析します。
  - region "保存済みの教材を開く":
    - heading "保存済みの教材を開く" [level=2]
    - list:
      - listitem:
        - button "教員確認の教材 — 承認済み"
        - text: 元画像未保存（以前の教材）
    - paragraph: 自分の教材を最大100件表示します。教材を開くと保存時点の数値と元画像を読み込みます。
  - region "グラフ画像を選択":
    - text: "01"
    - heading "グラフ画像を選択" [level=2]
    - paragraph: 数値ラベルが付いた、単系列の縦棒グラフに対応しています。
    - text: 教材のグラフ画像
    - paragraph: PNG / JPEG · 5 MiB以下 · 2〜12項目 32px以上・1200万画素以下の静止画
    - button "教材のグラフ画像"
    - figure "sample.png":
      - img "照合用の元グラフ"
      - text: sample.png
    - button "グラフを読み取る"
    - paragraph: 画像は解析のためGeminiへ送信します。個人情報を含む画像は使用しないでください。解析に成功した画像は教員本人だけが再確認できる非公開ストレージへ保存します。教材データは「保存」を選んだときFirestoreへ保存します。
  - region "読み取り結果":
    - text: "02"
    - heading "読み取り結果" [level=2]
    - text: AI抽出・未検証
    - status
    - paragraph: AIの読み取り結果です。桁表記を含む値は安全のため未確定にする場合があります。保存・承認した教材とは別に保持します。配布する値と承認状態は、下の教員確認データで管理します。数値の桁と単位も照合してください。
    - heading "教員確認の教材" [level=3]
    - paragraph: 単位：人
    - table "AI抽出データ（教員確認前）":
      - caption: AI抽出データ（教員確認前）
      - rowgroup:
        - row "項目 数値 画像内の表記":
          - columnheader "項目"
          - columnheader "数値"
          - columnheader "画像内の表記"
      - rowgroup:
        - row "A 12 12":
          - rowheader "A"
          - cell "12"
          - cell "12"
        - row "B 18 18":
          - rowheader "B"
          - cell "18"
          - cell "18"
    - group: 構造化JSONを確認
    - region "教員による確認・編集":
      - heading "教員による確認・編集" [level=3]
      - strong: 教材：承認済み（配布版固定）
      - paragraph: 次に：学生向け教材を開き、配布する内容を確認してください。
      - paragraph: 元画像と照合して修正してください。数値が読めない場合は空欄のままにし、「未確定」として保存します。単位が不明な場合も空欄を保持します。
      - group "教員が確認するデータ":
        - text: 教員が確認するデータ タイトル
        - textbox "タイトル" [disabled]: 教員確認の教材
        - text: 単位（空欄は未確定）
        - textbox "単位（空欄は未確定）" [disabled]: 人
        - table "編集用データ表":
          - caption: 編集用データ表
          - rowgroup:
            - row "項目名 数値（空欄は未確定）":
              - columnheader "項目名"
              - columnheader "数値（空欄は未確定）"
          - rowgroup:
            - row "A 12":
              - cell "A":
                - textbox "項目1の名前" [disabled]: A
              - cell "12":
                - spinbutton "項目1の数値" [disabled]: "12"
            - row "B 18":
              - cell "B":
                - textbox "項目2の名前" [disabled]: B
              - cell "18":
                - spinbutton "項目2の数値" [disabled]: "18"
        - button "修正を保存" [disabled]
      - status: 承認済みの変更できない版を保存しました。
      - heading "承認版を作成しました" [level=3]
      - paragraph: この版は変更できません。元の未承認データも編集できなくなります。
      - paragraph:
        - text: 承認版ID：
        - code: cccccccccccccccccccccccccccccccc
      - link "学生向け教材を開く":
        - /url: /learn/cccccccccccccccccccccccccccccccc
      - text: 学生向け共有URL
      - textbox "学生向け共有URL": https://example.test/learn/cccccccccccccccccccccccccccccccc
      - paragraph: 現在はIAM非公開です。共有先でもCloud Runのアクセス権が必要です。
  - complementary:
    - strong: 確かめてから、届ける。
    - paragraph: AIの読み取りは学びの出発点。教員による確認を経て、安心して使える教材につなげます。